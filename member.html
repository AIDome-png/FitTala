.sw{width:44px;height:26px;border-radius:99px;border:1px solid var(--ln-strong);background:var(--ln);position:relative;padding:0;cursor:pointer;flex:none}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004;transition:transform .18s}
.sw[aria-checked=true]{background:var(--or);border-color:var(--or)}.sw[aria-checked=true]:after{transform:translateX(18px)}
.ls .sw{display:block;position:relative;width:28px;height:28px;padding:0;border:2px solid var(--ln-strong);border-radius:50%;background:var(--sf);flex:none}
.ls .sw:after{content:"";position:absolute;top:5px;left:5px;width:14px;height:14px;border-radius:50%;background:transparent;box-shadow:none;transform:none;transition:background-color .16s}
.ls .sw[aria-checked=true]{background:var(--or);border-color:var(--or)}.ls .sw[aria-checked=true]:after{background:#141414;transform:none}
.rp{display:grid;gap:8px}.rp>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:var(--bg);border-radius:10px}
.rp .l1{font-weight:600}.rp .r1{text-align:right;display:grid;gap:4px;justify-items:end}.rp b.am{font:700 22px/1 "Barlow Condensed",Arial,sans-serif}
.pl2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.pc{border:1px solid var(--ln);border-left:4px solid var(--or);border-radius:12px;padding:14px 16px;background:var(--sf)}
.pc.Pending{border-left-color:#d99a1c}.pc.Declined{border-left-color:var(--er)}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}.ph b{font-size:17px}.ph .am{font:700 26px/1 "Barlow Condensed",Arial,sans-serif;display:block;text-align:right;margin-bottom:4px}
.pd>div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--ln);font-size:14px}.pd span{color:var(--mu)}.pd b{text-align:right;word-break:break-word}
.pc .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sl{display:grid;gap:6px}.sl>div{display:grid;grid-template-columns:24px 1fr auto auto;align-items:center;gap:12px;padding:10px 12px;background:var(--bg);border-radius:10px}
.more{margin-top:12px}
.hr{display:flex;align-items:center;gap:10px}
.bell{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid #3a3c42;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.bell svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bell i{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:var(--or);color:#141414;font:700 11px/18px Barlow,Arial,sans-serif;text-align:center;font-style:normal}
.bell:hover{border-color:var(--or)}
.nl{display:grid;gap:10px}.ni{border:1px solid var(--ln);border-left:4px solid var(--or);border-radius:10px;padding:12px 14px}
.ni.Confirmed{border-left-color:#16a34a}.ni.Declined{border-left-color:var(--er)}.ni p{margin:4px 0 8px}.ni .bt.s{padding:4px 12px}
.pl2{align-items:start}
.pl2{grid-template-columns:1fr}
details.pc summary{list-style:none;cursor:pointer}details.pc summary::-webkit-details-marker{display:none}
.pc .ph{margin-bottom:0}.pc[open] .ph{margin-bottom:10px}
.ph .chev{display:inline-block;margin-left:6px;color:var(--mu);font-size:22px;line-height:1;transition:transform .18s}.pc[open] .chev{transform:rotate(90deg)}
.ph .rt{display:flex;align-items:center}
.Cancelled,.Disabled{background:var(--ln);color:var(--mu)}

home(){const{s,o}=info(),os=mine();
const nx=os.map(x=>{const n=nextDue(x);return n&&{...n,o:x}}).filter(Boolean).sort((a,b)=>a.due<b.due?-1:1)[0];
const live=o&&['Active','Expiring','Suspended'].includes(s);
let alerts='';
if(s=='Suspended'){const r=rows(o).find(x=>x.over);alerts+=al(`<b>Your access is suspended.</b> Installment ${r.i} of ${peso(r.amt)} was due on ${r.due}. Pay it to get your access back. <button class="bt s" onclick="openPay('${o.id}')">Pay now</button>`,1)}
os.filter(x=>pend(x)>0).forEach(x=>alerts+=al(`<b>Payment under review.</b> Your ${peso(pend(x))} payment for ${x.plan} is waiting for staff to confirm it.`));
if(s=='Expiring')alerts+=al(`<b>Your plan ends on ${o.end}.</b> Renew from Plans. The new plan starts right after this one. <button class="bt s" onclick="go('plans')">See plans</button>`);
if(s=='Expired'||s=='No plan')alerts+=al(`<b>You have no active plan.</b> Pick one to start training. <button class="bt s" onclick="go('plans')">See plans</button>`,1);
if(s=='Pending'&&!os.some(x=>pend(x)>0))alerts+=al(`<b>Your membership is not active yet.</b> Complete your payment to start. <button class="bt s" onclick="openPay('${o.id}')">Pay now</button>`);
return `<h1>Hello, ${esc(me.n.split(' ')[0])}</h1><p class="sub">Here is the overall status of your account.</p>${alerts}
${kp([['Account status',s],['Current plan',live?o.plan:'—',live?'ends '+o.end:''],['Days left',live?dd(T,o.end):'—',os.filter(x=>ost(x)=='Queued').length?'+ '+os.filter(x=>ost(x)=='Queued').length+' queued':''],['Next payment',nx?peso(nx.amt):'—',nx?(nx.due<T?'overdue since ':'due ')+nx.due:'nothing due']])}
<div class="c mt"><h2>Recent payments</h2><div class="rp">${hist(os).slice(0,4).map(p=>`<div><div><div class="l1">${p.o.plan} <span class="mu">${p.id}</span></div><div class="mu">${p.dt} · ${p.me}</div></div><div class="r1"><b class="am">${peso(p.a)}</b>${bd(p.v?'Void':p.st)}</div></div>`).join('')||'<p class="mu">No payments yet.</p>'}</div>${pays.some(p=>os.some(x=>x.id==p.o))?`<button class="bt s more" onclick="go('mem')">See full payment details</button>`:''}</div>`},

mem(){const os=mine(),ord={Active:0,Suspended:0,Queued:1,Pending:2,Expired:3},list=[...os].sort((a,b)=>ord[ost(a)]-ord[ost(b)]);
const card=o=>{const st=ost(o),c=conf(o),nd=nextDue(o),inst=o.pp=='Installment',pr=Math.min(100,Math.round(c/o.price*100));
const when=o.start?(st=='Queued'?`Starts ${o.start} (after your current plan) · ends ${o.end}`:`${o.start} to ${o.end}`):'Starts once your first payment is confirmed';
return `<div class="c mt"><div class="row" style="align-items:center;justify-content:space-between"><h2 style="margin:0;border:0;padding:0">${o.plan} <span class="mu">${o.id}</span></h2>${bd(st)}</div>
<p class="mu" style="margin:6px 0 12px">${when}</p>
<div class="rc"><div><span>Paying plan</span><b>${o.pp}${inst?' · '+o.freq.toLowerCase()+' ('+o.n+' payments)':''}</b></div><div><span>Total</span><b>${peso(o.price)}</b></div><div><span>Paid</span><b>${peso(c)}</b></div><div><span>Balance</span><b>${peso(o.price-c)}</b></div></div>
<div class="pg" style="margin:12px 0"><i style="width:${pr}%"></i></div>
${inst?`<div class="sl">${rows(o).map(r=>`<div><span class="mu">${r.i}</span><span>${r.due}</span><b>${peso(r.amt)}</b>${bd(r.paid?'Paid':r.pd?'Pending':r.over?'Overdue':r.due==T?'Due today':'Upcoming')}</div>`).join('')}</div>`:''}
${nd?(nd.aw?'<p class="mu">Your payment is waiting for staff to confirm it.</p>':`<button class="bt" style="margin-top:12px" onclick="openPay('${o.id}')">${inst?`Pay installment ${nd.no} · ${peso(nd.amt)}`:`Pay ${peso(nd.amt)}`}</button>`):''}</div>`};
return `<h1>My membership</h1><p class="sub">Your plans, balance and installments. Queued plans start right after the current one ends.</p>
${list.map(card).join('')||'<div class="c"><p class="mu">You have no memberships yet.</p><button class="bt" onclick="go(\'plans\')">See plans</button></div>'}
<div class="c mt"><h2>Payment history</h2><div class="pl2">${hist(os).map(p=>pcard(p,1)).join('')||'<p class="mu">No payments yet.</p>'}</div>
<p class="mu">Your payment records. A payment stays Pending until staff confirm it.</p></div>`},

prof(){const dk=document.documentElement.dataset.theme=='dark';
return `<h1>Profile</h1><p class="sub">Your details and account settings.</p>
<div class="pf"><div class="av big">${ini(me.n)}</div><div><div class="hd" style="font-size:28px;line-height:1.1">${esc(me.n)}</div><div class="mu">Member ID ${me.id}</div></div></div>
<div class="g g2"><div class="c"><h2>Details</h2><div class="rc"><div><span>Contact</span><b>${me.c}</b></div><div><span>Address</span><b style="text-align:right">${esc(addrStr(me.a)||'Not added yet')}</b></div><div><span>Member since</span><b>${me.j}</b></div></div></div>
<div class="c"><h2>Account</h2><div class="ls"><button onclick="pwM()">Change password<i>›</i></button>
<div class="lr"><span>Notifications</span><button class="sw" role="switch" aria-label="Notifications" aria-checked="${me.nt!==0}" onclick="toggleNotifs(this)"></button></div>
<div class="lr"><span>Dark mode</span><button class="sw" role="switch" aria-label="Dark mode" data-t="1" aria-checked="${dk}" onclick="toggleTheme()"></button></div>
<button onclick="helpM()">Help and support<i>›</i></button><button class="so" onclick="out()">Sign out</button></div></div></div>`},

plans(){const ns=nextStart();
return `<h1>Membership plans</h1><p class="sub">Choose a plan. ${ns>T?`Your new plan will start on <b>${ns}</b>, right after your current one.`:'It starts as soon as your payment is confirmed.'}</p>
<div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${plans.filter(p=>p.a).map(p=>`<div class="c"><span class="hd" style="font-size:24px;display:block">${p.n}</span><span class="hd" style="font-size:36px;display:block;color:var(--ot)">${peso(p.p)}</span><p class="mu">${p.days} days</p>
<p style="margin:8px 0 4px"><b>Pay in full</b> or in installments:</p>${fopts(p).map(f=>`<div class="mu">${f.f}: ${f.n} × ${peso(Math.floor(p.p/f.n))}</div>`).join('')}
<p class="mu" style="margin-top:8px">Installments: you can start after the first payment. Missing a due date suspends your access until you pay.</p>
<button class="bt w" onclick="openBuy('${p.n}')">Buy ${p.n}</button></div>`).join('')}</div>`}};

function ov(h){let m=document.getElementById('md');if(!m){m=document.createElement('div');m.id='md';m.className='mdl';document.body.appendChild(m)}m.innerHTML=`<div class="c" role="dialog" aria-modal="true">${h}</div>`}
function closeM(){const m=document.getElementById('md');if(m)m.remove()}
function pwM(){ov(`<h2>Change password</h2>${me.mcp?'<p class="mu">Staff reset your password. Choose a new one to continue.</p>':''}<label>Current password</label><input id="cp" type="password" autocomplete="current-password"><label>New password</label><input id="np" type="password" autocomplete="new-password"><label>Confirm new password</label><input id="cf" type="password" autocomplete="new-password">
<p id="er" style="color:var(--er);min-height:20px;margin:6px 0 0;font-size:13px"></p><div class="row" style="margin-top:6px"><button class="bt s" onclick="closeM()">Cancel</button><button class="bt" onclick="savePw()">Save password</button></div>`)}
async function toggleNotifs(btn){const nextVal=me.nt===0?1:0;me.nt=nextVal;btn.setAttribute('aria-checked',String(nextVal!==0));await memberApi('update_notifications',{notifications_on:nextVal})}
async function savePw(){const g=i=>document.getElementById(i).value,e=document.getElementById('er');
if(g('np').length<8)return e.textContent='Use at least 8 characters for the new password.';
if(g('np')!=g('cf'))return e.textContent='The new passwords do not match.';
const res=await memberApi('change_password',{current:g('cp'),new:g('np')});
if(!res.ok)return e.textContent=res.error||'Could not change password.';
me.mcp=0;closeM();toast('Password changed')}
function helpM(){ov(`<h2>Help and support</h2><p class="mu">Ask the front desk to check a payment, fix your details or reset your password.</p><div class="rc"><div><span>Front desk</span><b>0917 000 0000</b></div></div><button class="bt w" onclick="closeM()">Close</button>`)}
const rdraw=()=>mo.k=='buy'?buyM():payM();
const payForm=()=>`<label>Method</label><select onchange="mo.me=this.value;rdraw()">${ME.map(x=>`<option ${mo.me==x?'selected':''}>${x}</option>`).join('')}</select>
<div class="al" style="margin:10px 0 0">Send to: <b>${mo.me=='GCash'?'GCash 0917 000 0000 (FitTala Gym)':'BDO 0000 0000 00 (FitTala Gym)'}</b><br><span class="mu">Pay first, then enter the reference number from your receipt.</span></div>
<label>Reference number</label><input value="${esc(mo.ref||'')}" oninput="mo.ref=this.value" placeholder="From your GCash or bank receipt">
<p id="er" style="color:var(--er);min-height:20px;margin:6px 0 0;font-size:13px"></p>
<div class="row" style="margin-top:6px"><button class="bt s" onclick="closeM()">Cancel</button><button class="bt" onclick="submitP()">Submit payment</button></div>`;
function openBuy(n){mo={k:'buy',plan:n,pp:'Full',fi:0,me:'GCash',ref:''};buyM()}
function buyM(){const p=planOf(mo.plan),fo=fopts(p),f=fo[mo.fi]||fo[0],inst=mo.pp=='Installment'&&f,base=inst?Math.floor(p.p/f.n):p.p,ns=nextStart();
ov(`<h2>Buy ${p.n}</h2><label>Membership to pay</label><input value="${p.n} · ${p.days} days · ${peso(p.p)}" readonly>
<label>Paying plan</label><select onchange="mo.pp=this.value;buyM()"><option ${mo.pp=='Full'?'selected':''}>Full</option>${fo.length?`<option ${mo.pp=='Installment'?'selected':''}>Installment</option>`:''}</select>
${inst?`<label>Pay every</label><select onchange="mo.fi=+this.value;buyM()">${fo.map((x,i)=>`<option value="${i}" ${i==mo.fi?'selected':''}>${x.f} · ${x.n} payments</option>`).join('')}</select><p class="mu" style="margin:6px 0 0">${f.n} payments of ${peso(base)}${p.p-base*f.n?' (the last one is '+peso(p.p-base*(f.n-1))+')':''}. Your first payment gives you access.</p>`:''}
<label>Amount (₱)</label><input value="${base}" readonly><p class="mu" style="margin:6px 0 0">Starts <b>${ns}</b> after staff confirm your payment${ns>T?' (right after your current plan)':''}.</p>${payForm()}`)}
function openPay(id){mo={k:'pay',o:id,me:'GCash',ref:''};payM()}
function payM(){const x0=mine().map(o=>({o,n:nextDue(o)})).filter(x=>x.n&&!x.n.aw),x=x0.find(y=>y.o.id==mo.o)||x0[0];
if(!x)return ov('<h2>Nothing to pay</h2><p class="mu">You have no payment due right now.</p><button class="bt w" onclick="closeM()">Close</button>');mo.o=x.o.id;
ov(`<h2>${x.o.pp=='Full'?'Pay membership':'Pay installment'}</h2><label>Membership to pay</label><select onchange="mo.o=this.value;payM()">${x0.map(y=>`<option value="${y.o.id}" ${y.o.id==mo.o?'selected':''}>${y.o.plan} (${y.o.id})${y.o.pp=='Installment'?' · installment '+y.n.no+' of '+y.o.n:' · full payment'}</option>`).join('')}</select>
<label>Amount (₱)</label><input value="${x.n.amt}" readonly><p class="mu" style="margin:6px 0 0">Due ${x.n.due}${x.n.due<T?' (overdue)':''}</p>${payForm()}`)}
async function submitP(){const ref=(mo.ref||'').trim();if(ref.length<4)return er.textContent='Enter the reference number from your receipt (at least 4 characters).';
if(pays.some(x=>x.me==mo.me&&String(x.ref).toLowerCase()==ref.toLowerCase()&&x.st!='Declined'))return er.textContent='This reference number was already used. Check your receipt.';
let pId,oId,pName,amt,kind;
if(mo.k=='buy'){const p=planOf(mo.plan),fo=fopts(p),f=fo[mo.fi]||fo[0],inst=mo.pp=='Installment'&&f;const base=inst?Math.floor(p.p/f.n):p.p;
const res=await memberApi('buy_plan',{plan:p.n,paying_plan:inst?'Installment':'Full',freq:inst?f.f:null,n:inst?f.n:null,every:inst?f.e:null,method:mo.me,ref,amount:base});
if(!res.ok)return er.textContent=res.error||'Could not submit payment.';
pId=res.pay_id;oId=res.order_id;pName=p.n;amt=base;kind=inst?`Installment 1 of ${f.n} (${f.f.toLowerCase()})`:'Full payment'}
else{const o=orders.find(x=>x.id==mo.o),n=nextDue(o);
const res=await memberApi('submit_payment',{membership_id:o.id,method:mo.me,ref,amount:n.amt});
if(!res.ok)return er.textContent=res.error||'Could not submit payment.';
pId=res.pay_id;oId=o.id;pName=o.plan;amt=n.amt;kind=o.pp=='Full'?'Full payment':`Installment ${n.no} of ${o.n}`}
await loadMemberData();
ov(`<div class="ck" aria-hidden="true">&#10003;</div><h2 class="ct">Payment submitted</h2><p class="mu ct">Keep this for your records.</p><div class="rc"><div><span>Reference no.</span><b>${pId}</b></div><div><span>Membership</span><b>${pName} (${oId})</b></div><div><span>Type</span><b>${kind}</b></div><div><span>Amount</span><b>${peso(amt)}</b></div><div><span>Method</span><b>${mo.me}</b></div><div><span>Your receipt ref.</span><b>${esc(ref)}</b></div><div><span>Date and time</span><b>${T} ${nowT()}</b></div><div><span>Status</span><b>${bd('Pending')}</b></div></div>
<p class="mu" style="margin-top:10px">Staff will check this against the GCash or bank record. Your membership starts once it is confirmed.</p><button class="bt w" onclick="closeM();go('mem')">View my membership</button>`);render()}
const root=document.getElementById('root');
memberApi('me').then(async r=>{if(r.ok){me=r.member;await loadMemberData();render()}else login()});

function setTheme(theme,save=true){document.documentElement.dataset.theme=theme;const button=document.getElementById('theme-toggle');button.textContent=theme=='dark'?'Light mode':'Dark mode';button.setAttribute('aria-label',`Switch to ${theme=='dark'?'light':'dark'} mode`);button.setAttribute('aria-pressed',String(theme=='dark'));document.querySelectorAll('.sw[data-t]').forEach(b=>b.setAttribute('aria-checked',String(theme=='dark')));if(save)try{localStorage.setItem('fittala-theme',theme)}catch(error){console.warn('Unable to save the theme preference.',error)}}
function toggleTheme(){setTheme(document.documentElement.dataset.theme=='dark'?'light':'dark')}
let savedTheme='';try{savedTheme=localStorage.getItem('fittala-theme')||''}catch(error){console.warn('Unable to read the saved theme preference.',error)}
setTheme(document.documentElement.dataset.theme||(savedTheme=='dark'||savedTheme=='light'?savedTheme:window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),false);
</script></body></html>
